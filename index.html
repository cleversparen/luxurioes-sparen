<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxuriös Sparen</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
}

header{
background:#000;
padding:25px;
border-bottom:3px solid gold;
}

h1{
color:gold;
font-size:48px;
margin-top:60px;
}

p{
font-size:22px;
}

.button{
display:inline-block;
margin-top:30px;
padding:18px 40px;
background:gold;
color:black;
font-weight:bold;
text-decoration:none;
border-radius:40px;
}

.hero{
padding:120px 20px;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6));
}

.cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
padding:60px 20px;
}

.card{
width:280px;
background:#222;
padding:25px;
border-radius:20px;
}

.card h2{
color:gold;
}

footer{
padding:30px;
background:#000;
color:#999;
margin-top:40px;
}
</style>

</head>

<body>

<header>
<h2>Luxuriös Sparen</h2>
</header>

<div class="hero">
<h1>Luxuriös sparen</h1>

<p>Reisen · Hotels · Strom · Gas · Versicherungen · DSL</p>

<a class="button" href="#">Jetzt Angebote entdecken</a>

</div>

<div class="cards">

<div class="card">
<h2>✈ Reisen</h2>
<p>Die schönsten Urlaubsangebote entdecken.</p>
</div>

<div class="card">
<h2>⚡ Strom & Gas</h2>
<p>Jetzt Tarife vergleichen und sparen.</p>
</div>

<div class="card">
<h2>🛡 Versicherungen</h2>
<p>Passende Tarife bequem vergleichen.</p>
</div>

</div>

<footer>

© 2026 Luxuriös Sparen

</footer>

</body>
</html>
